{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Add Product</title>

    <link rel="stylesheet"
          href="{% static 'css/add_product.css' %}">

</head>

<body>

    <div class="form-container">

        <h1>Add Product</h1>

        <form id="productForm"
              enctype="multipart/form-data">

            {% csrf_token %}

            <label>Product Name</label>

            <input
                type="text"
                name="name"
                required
            >

            <label>Price</label>

            <input
                type="number"
                name="price"
                step="0.01"
                required
            >

            <label>Product Image</label>

            <input
                type="file"
                name="image"
                accept="image/*"
                required
            >

            <button type="submit">
                Create Product
            </button>

        </form>

    </div>


    <script>

        document.getElementById("productForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const form = event.target;

                const formData = new FormData(form);

                const response = await fetch(
                    "/api/products/",
                    {
                        method: "POST",

                        body: formData,

                        headers: {
                            "X-CSRFToken":
                                document.querySelector(
                                    "[name=csrfmiddlewaretoken]"
                                ).value,
                                 "Authorization": `Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzkwMDU3NjI3LCJpYXQiOjE3OTAwNTQwMjcsImp0aSI6ImIwYmNhYTdhOTc3OTRlOThhYmIzNDk0ODNhOTNhMThmIiwidXNlcl9pZCI6IjMifQ.yDGHSxtSYpyQlt2RQydw6QqYRnbR8J1p0aeq7J9o9M0 `  
                        }
                    }
                );

                const data = await response.json();

                if (response.ok) {

                    alert("Product created successfully!");

                    window.location.href = "/products/";

                } else {

                    alert(JSON.stringify(data));

                }

            }
        );

    </script>

</body>

</html>
